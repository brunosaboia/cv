name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2

    - name: Run unit tests
      run: make test

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2

    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-recommended \
          texlive-fonts-recommended \
          texlive-latex-extra \
          lmodern

    - name: Build sample CV (default market, strict)
      run: make build STRICT=1

    - name: Build sample CV (ATS layout, strict)
      run: make build LAYOUT=ats STRICT=1

    # The two axes are independent, so build a combination as well: the ATS
    # layout has to drop the photo a photo market asks for without --strict
    # tripping over the file it never reads.
    - name: Build sample CV (ATS layout, CH market, strict)
      run: make build LAYOUT=ats MARKET=switzerland STRICT=1

    # Both layouts take a different route through their templates with links
    # off, so build both rather than trusting one to cover the other.
    - name: Build sample CV (no link annotations, strict)
      run: |
        make build LINKS=0 STRICT=1
        make build LAYOUT=ats LINKS=0 STRICT=1

    # txt has no LaTeX pass at all, so it also has to survive check-latex
    # without ever needing pdflatex -- run it before LaTeX is even relevant.
    - name: Build sample CV (txt layout, strict)
      run: make build LAYOUT=txt STRICT=1

    - name: Build sample CV (txt layout, Switzerland market, strict)
      run: make build LAYOUT=txt MARKET=switzerland STRICT=1

    - name: Upload sample PDFs
      uses: actions/upload-artifact@v7
      with:
        name: sample-cvs
        path: out/*.pdf
        retention-days: 14

    - name: Upload sample TXTs
      uses: actions/upload-artifact@v7
      with:
        name: sample-cv-txts
        path: out/*.txt
        retention-days: 14
